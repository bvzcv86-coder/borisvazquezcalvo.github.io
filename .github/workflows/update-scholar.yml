name: Update publication citations

"on":
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-google-scholar
  cancel-in-progress: false

jobs:
  update-scholar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the publication source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Refresh Google Scholar when accessible
        id: scholar
        continue-on-error: true
        run: python scripts/update_scholar.py

      - name: Preserve Scholar snapshot when automated access is blocked
        if: steps.scholar.outcome == 'failure'
        run: echo "::warning::Google Scholar could not be refreshed. Last verified Scholar data preserved; Crossref updates independently."

      - name: Refresh Crossref citation counts by DOI
        run: python scripts/update_crossref.py

      - name: Render the static publication archive
        run: python scripts/render_publications.py

      - name: Commit the updated publication data
        id: commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- publications.json publications/index.html sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- publications.json publications/index.html sitemap.xml
          git commit -m "Update publication citation counts and static archive"
          git push origin HEAD:main

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages with the updated citations
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATED_COMMIT: ${{ steps.commit.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

          for attempt in {1..30}; do
            build_state=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" \
              --jq '.status + " " + (.commit // "")')
            read -r status built_commit <<< "$build_state"

            if [[ "$status" == "built" && -n "$built_commit" ]]; then
              if [[ "$built_commit" == "$UPDATED_COMMIT" ]]; then
                echo "GitHub Pages published the updated citations."
                exit 0
              fi

              relation=$(gh api \
                "repos/$GITHUB_REPOSITORY/compare/$UPDATED_COMMIT...$built_commit" \
                --jq '.status')

              if [[ "$relation" == "ahead" || "$relation" == "identical" ]]; then
                echo "GitHub Pages published a newer commit containing the updated citations."
                exit 0
              fi
            fi

            if [[ "$status" == "errored" && "$built_commit" == "$UPDATED_COMMIT" ]]; then
              echo "::error::GitHub Pages could not publish the updated data."
              exit 1
            fi

            sleep 10
          done

          echo "::error::The updated GitHub Pages build was not confirmed within five minutes."
          exit 1
