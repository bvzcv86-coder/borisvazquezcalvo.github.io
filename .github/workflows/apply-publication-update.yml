name: Apply reviewed publication pages

"on":
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-google-scholar
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply the reviewed pages, PDFs and references
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          
          assert os.environ['GITHUB_REPOSITORY'] == 'bvzcv86-coder/borisvazquezcalvo.github.io'
          bundle=Path('publication-update.zip')
          assert hashlib.sha256(bundle.read_bytes()).hexdigest() == '5488dbb78e3f4cdae723848eb1de8160108f52183e4b48ba0787385f74490348', 'Unexpected publication bundle'
          with zipfile.ZipFile(bundle) as archive:
              manifest=json.loads(archive.read('manifest.json'))
              assert len(manifest)==80 and len({i['path'] for i in manifest})==len(manifest)
              for item in manifest:
                  name=item['path']; parts=PurePosixPath(name).parts; path=Path(name)
                  assert parts and not name.startswith('/') and '..' not in parts and '.git' not in parts and '.github' not in parts
                  assert not any(parent.is_symlink() for parent in [path,*path.parents])
                  assert path.suffix in ['.html','.css','.js','.py','.json','.md','.xml','.pdf','.ris','.bib']
                  if item['before'] is None:
                      assert not path.exists(), 'New file already exists: '+name
                  else:
                      assert path.is_file() and hashlib.sha256(path.read_bytes()).hexdigest()==item['before'], 'Concurrent edit detected: '+name
                  assert hashlib.sha256(archive.read('payload/'+name)).hexdigest()==item['after']
              # Validate all baseline files and payload hashes before writing anything.
              for item in manifest:
                  path=Path(item['path']); path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(archive.read('payload/'+item['path']))
          bundle.unlink()
          helper=Path('.github/workflows/apply-publication-update.yml')
          assert helper.is_file()
          helper.unlink()
          subprocess.run(['git','add','--',*[i['path'] for i in manifest],str(bundle),str(helper)],check=True)
          print('Applied all reviewed files and removed the temporary bundle and workflow.')
          PY
      - name: Commit the publication pages and reference downloads
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add individual publication pages and portable citation downloads"
          git push origin HEAD:main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages with the updated citations
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATED_COMMIT: ${{ steps.commit.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

          for attempt in {1..30}; do
            build_state=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" \
              --jq '.status + " " + (.commit // "")')
            read -r status built_commit <<< "$build_state"

            if [[ "$status" == "built" && -n "$built_commit" ]]; then
              if [[ "$built_commit" == "$UPDATED_COMMIT" ]]; then
                echo "GitHub Pages published the updated citations."
                exit 0
              fi

              relation=$(gh api \
                "repos/$GITHUB_REPOSITORY/compare/$UPDATED_COMMIT...$built_commit" \
                --jq '.status')

              if [[ "$relation" == "ahead" || "$relation" == "identical" ]]; then
                echo "GitHub Pages published a newer commit containing the updated citations."
                exit 0
              fi
            fi

            if [[ "$status" == "errored" && "$built_commit" == "$UPDATED_COMMIT" ]]; then
              echo "::error::GitHub Pages could not publish the updated data."
              exit 1
            fi

            sleep 10
          done

          echo "::error::The updated GitHub Pages build was not confirmed within five minutes."
          exit 1
